name: .Net Project

on:
    pull_request:
        branches:
            - develop

jobs:
    build:
        runs-on: ubuntu-24.04

        steps:
          - uses: actions/checkout@v4
          - uses: actions/setup-dotnet@v4
            with:
              dotnet-version: '9'
        #   - name: Restore dependencies
        #     run: dotnet restore 
          - name: list files
            run: ls         
          - name: Build
            run: dotnet build src/Presentation/Nop.Web/Nop.Web.csproj
            
          - uses: actions/checkout@master
          - name: Download artifact from build
            uses: bettermarks/action-artifact-download@0.3.0
            with:
              repo: arshadgit/nopCommerce-apr25.git
              token: ${{ secrets.GITHUB_TOKEN }}
              artifact_name: nop-artifact